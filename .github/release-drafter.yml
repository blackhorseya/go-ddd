# Release Drafter 設定
# 依 merged PR 的 label 彙整下一版 release notes 草稿
# Label 由 autolabeler 依 PR 標題（Conventional Commits）自動貼上
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "🚨 Breaking Changes"
    labels:
      - "breaking"
  - title: "🚀 Features"
    labels:
      - "feature"
  - title: "🐛 Bug Fixes"
    labels:
      - "fix"
  - title: "⚡ Performance"
    labels:
      - "performance"
  - title: "♻️ Refactor"
    labels:
      - "refactor"
  - title: "📝 Documentation"
    labels:
      - "documentation"
  - title: "🧪 Tests"
    labels:
      - "test"
  - title: "🧰 Maintenance"
    labels:
      - "chore"
      - "ci"
      - "build"
  - title: "📦 Dependencies"
    labels:
      - "dependencies"

exclude-labels:
  - "skip-changelog"

change-template: "- $TITLE by @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - "breaking"
  minor:
    labels:
      - "feature"
  patch:
    labels:
      - "fix"
      - "performance"
      - "refactor"
      - "documentation"
      - "test"
      - "chore"
      - "ci"
      - "build"
      - "dependencies"
  default: patch

# 依 PR 標題（Conventional Commits）自動貼 label
autolabeler:
  - label: "breaking"
    title:
      - '/^[a-z]+(\(.+\))?!:/'
  - label: "feature"
    title:
      - '/^feat(\(.+\))?:/'
  - label: "fix"
    title:
      - '/^fix(\(.+\))?:/'
  - label: "performance"
    title:
      - '/^perf(\(.+\))?:/'
  - label: "refactor"
    title:
      - '/^refactor(\(.+\))?:/'
  - label: "documentation"
    title:
      - '/^docs(\(.+\))?:/'
  - label: "test"
    title:
      - '/^test(\(.+\))?:/'
  # (deps) scope 只歸 dependencies，避免同一個 PR 同時出現在 Maintenance 和
  # Dependencies（release-drafter 會把 PR 放進每個符合 label 的分類）
  - label: "chore"
    title:
      - '/^(chore|style|revert)(\((?!deps\)).+\))?:/'
  - label: "ci"
    title:
      - '/^ci(\((?!deps\)).+\))?:/'
  - label: "build"
    title:
      - '/^build(\((?!deps\)).+\))?:/'
  # 只看標題，不看 go.mod：feat/fix PR 新增套件時仍歸在原本的分類
  - label: "dependencies"
    title:
      - '/^(chore|ci|build)\(deps\)!?:/'

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

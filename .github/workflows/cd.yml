# CD workflow for Go DDD project
# 觸發來源：release-drafter 自動發版後 dispatch（主要路徑）、手動 Publish release、手動 dispatch
# Jobs: prepare（版本解析與設定驗證）→ publish（建置與發佈）→ summary（結果彙報）
name: CD
run-name: "CD ${{ inputs.version || github.event.release.tag_name }}"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tag to build (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.event.release.tag_name }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version || github.event.release.tag_name }}"
          if ! git rev-parse --verify "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::tag $VERSION does not exist"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true

      - name: Validate GoReleaser config
        run: goreleaser check

  publish:
    name: Build & Publish
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.version }}
          fetch-depth: 0

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Setup Task
        uses: ./.github/actions/setup-task

      - name: Setup GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Publish
        run: task release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Summary
    needs: [prepare, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## CD Summary

          | Item | Value |
          |------|-------|
          | **Version** | `${{ needs.prepare.outputs.version }}` |
          | **Prepare** | `${{ needs.prepare.result }}` |
          | **Publish** | `${{ needs.publish.result }}` |
          | **Trigger** | `${{ github.event_name }}` |
          | **Actor** | @${{ github.actor }} |
          EOF

          if [ "${{ needs.publish.result }}" = "success" ]; then
            cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'

          ### Artifacts 📦
          - [GitHub Release](https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.version }})
          - [Docker Image](https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }})
          EOF
          fi

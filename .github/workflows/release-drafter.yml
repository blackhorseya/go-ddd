# Release Drafter workflow
# 1. CI 在 main 上成功後：自動發佈 release（依 merged PR 的 label 分類 notes、推算版號），並 dispatch CD
#    註：GITHUB_TOKEN 發佈的 release 不會觸發其他 workflow，故需主動 dispatch cd.yml
# 2. PR 開啟/更新：依 PR 標題（Conventional Commits）自動貼 label
# 設定檔：.github/release-drafter.yml
name: Release Drafter

on:
  # 等 CI 成功才發版，避免壞掉的 commit 被發佈
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # pull_request_target 讓 fork 來的 PR 也能被貼 label
  # 此 workflow 不 checkout PR 程式碼，無安全疑慮
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    name: Publish Release
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Publish Release
        id: drafter
        uses: release-drafter/release-drafter@v7
        with:
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger CD
        run: gh workflow run cd.yml -R "$GITHUB_REPOSITORY" -f version="$TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.drafter.outputs.tag_name }}

  autolabel:
    name: Auto Label PR
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Apply Labels from PR Title
        uses: release-drafter/release-drafter/autolabeler@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

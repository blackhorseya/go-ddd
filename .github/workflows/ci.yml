# CI workflow for Go DDD project
# Runs on push to main and pull requests
# Jobs: lint, test, build
name: CI
run-name: "CI: ${{ github.event.pull_request.title || github.event.head_commit.message }} by @${{ github.actor }}"

on:
  push:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".goreleaser.yaml"
      - "Taskfile.yml"
      - ".golangci.yml"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
      - ".github/actions/**"
  pull_request:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".goreleaser.yaml"
      - "Taskfile.yml"
      - ".golangci.yml"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
      - ".github/actions/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Setup Task
        uses: ./.github/actions/setup-task

      - name: Format
        run: task fmt

      - name: Lint
        run: task lint

      - name: Test
        run: task test

      - name: Setup GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true

      - name: Build (GoReleaser)
        run: goreleaser build --snapshot --clean

      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## CI Summary

          | Item | Value |
          |------|-------|
          | **Commit** | `${{ github.sha }}` |
          | **Branch** | `${{ github.ref_name }}` |
          | **Actor** | @${{ github.actor }} |
          | **Event** | `${{ github.event_name }}` |

          ### Checks Passed ✅
          - [x] Format
          - [x] Lint
          - [x] Test
          - [x] Build
          EOF

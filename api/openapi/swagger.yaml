info:
  contact: {}
  description: Go DDD 範本專案 API，實作 Clean Architecture 與 Domain-Driven Design 原則
  title: Go DDD Service API
  version: 1.2.0
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: 使用 email 和密碼登入，回傳 JWT token pair
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_blackhorseya_go-ddd_internal_identity_application_dto.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_blackhorseya_go-ddd_internal_shared_adapter_http_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_blackhorseya_go-ddd_internal_identity_application_dto.AuthOutput'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blackhorseya_go-ddd_internal_shared_adapter_http_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_blackhorseya_go-ddd_internal_shared_adapter_http_response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_blackhorseya_go-ddd_internal_shared_adapter_http_response.Response'
      summary: Authenticate a credential
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用 refresh token 取得新的 token pair
      parameters:
      - description: Refresh payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_blackhorseya_go-ddd_internal_identity_application_dto.RefreshInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_blackhorseya_go-ddd_internal_shared_adapter_http_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_blackhorseya_go-ddd_internal_identity_application_dto.AuthOutput'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blackhorseya_go-ddd_internal_shared_adapter_http_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_blackhorseya_go-ddd_internal_shared_adapter_http_response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_blackhorseya_go-ddd_internal_shared_adapter_http_response.Response'
      summary: Refresh token pair
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: 建立新的認證憑證
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_blackhorseya_go-ddd_internal_identity_application_dto.RegisterInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_blackhorseya_go-ddd_internal_shared_adapter_http_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_blackhorseya_go-ddd_internal_identity_application_dto.CredentialOutput'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blackhorseya_go-ddd_internal_shared_adapter_http_response.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_blackhorseya_go-ddd_internal_shared_adapter_http_response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_blackhorseya_go-ddd_internal_shared_adapter_http_response.Response'
      summary: Register a new credential
      tags:
      - auth
  /healthz:
    get:
      description: 檢查服務是否存活
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_blackhorseya_go-ddd_internal_shared_adapter_http_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_shared_adapter_http_handler.HealthStatus'
              type: object
      summary: Liveness probe
      tags:
      - health
  /readyz:
    get:
      description: 檢查服務是否準備好接收流量
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_blackhorseya_go-ddd_internal_shared_adapter_http_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_shared_adapter_http_handler.HealthStatus'
              type: object
      summary: Readiness probe
      tags:
      - health
securityDefinitions:
  Bearer:
    description: '輸入 Bearer token，格式: "Bearer {token}"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"

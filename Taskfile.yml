# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  MODULE: github.com/blackhorseya/go-ddd
  BINARY: service
  BUILD_DIR: bin
  IMAGE: ghcr.io/blackhorseya/go-ddd
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"

tasks:
  # ============================================================================
  # Default
  # ============================================================================
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ============================================================================
  # Build & Run
  # ============================================================================
  build:
    desc: Build the service binary
    cmds:
      - go build -o {{.BUILD_DIR}}/{{.BINARY}} ./cmd/service/
    sources:
      - "**/*.go"
    generates:
      - "{{.BUILD_DIR}}/{{.BINARY}}"

  run:
    desc: Run the service
    cmds:
      - go run ./cmd/service/

  # ============================================================================
  # Test
  # ============================================================================
  test:
    desc: Run all tests
    cmds:
      - go test ./...

  test:cover:
    desc: Run tests with coverage
    cmds:
      - go test -cover ./...

  test:race:
    desc: Run tests with race detection
    cmds:
      - go test -race ./...

  test:integration:
    desc: Run integration tests (needs PostgreSQL; skips when unreachable)
    cmds:
      - go test -count=1 ./tests/integration/...

  test:all:
    desc: Run all test variants
    cmds:
      - task: test
      - task: test:race
      - task: test:cover
      - task: test:integration

  # ============================================================================
  # Code Quality
  # ============================================================================
  lint:
    desc: Run golangci-lint
    cmds:
      - go tool golangci-lint run

  lint:fix:
    desc: Run golangci-lint with auto-fix
    cmds:
      - go tool golangci-lint run --fix

  fmt:
    desc: Format code with gofmt
    cmds:
      - gofmt -w .

  imports:
    desc: Organize imports with goimports
    cmds:
      - goimports -w .

  # ============================================================================
  # Dependencies
  # ============================================================================
  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy

  verify:
    desc: Verify dependencies
    cmds:
      - go mod verify

  # ============================================================================
  # Code Generation
  # ============================================================================
  generate:
    desc: Run go generate
    cmds:
      - go generate ./...

  generate:wire:
    desc: Generate Wire dependency injection
    cmds:
      - go generate ./cmd/service/...

  swagger:
    desc: Generate Swagger documentation
    cmds:
      - go tool swag init -g cmd/service/main.go -o ./api/openapi --parseDependency --parseInternal

  mock:
    desc: Generate mocks
    cmds:
      - go generate ./...

  # ============================================================================
  # Development Workflow
  # ============================================================================
  dev:
    desc: Run development checks (lint + test)
    cmds:
      - task: lint
      - task: test

  ci:
    desc: Run CI pipeline (fmt, lint, test, build)
    cmds:
      - task: fmt
      - task: lint
      - task: test
      - task: build

  # ============================================================================
  # Pre-commit Checklist
  # ============================================================================
  check:
    desc: Run all pre-commit checks
    cmds:
      - task: fmt
      - task: tidy
      - task: lint
      - task: test
    summary: |
      Pre-commit checklist:
      1. golangci-lint run passed
      2. go test ./... all passed
      3. go mod tidy executed
      4. gofmt -w . executed

  # ============================================================================
  # Release (GoReleaser)
  # ============================================================================
  release:check:
    desc: Validate GoReleaser configuration
    cmds:
      - goreleaser check

  release:snapshot:
    desc: Build a snapshot release (local testing, no publish)
    cmds:
      - goreleaser release --snapshot --clean

  release:
    desc: Create a release (requires GITHUB_TOKEN)
    cmds:
      - goreleaser release --clean
    preconditions:
      - sh: test -n "$GITHUB_TOKEN"
        msg: "GITHUB_TOKEN environment variable is required"

  # ============================================================================
  # Docker Image
  # ============================================================================
  image:
    desc: Build Docker images via GoReleaser (no push)
    cmds:
      - goreleaser release --snapshot --clean --skip=publish

  # ============================================================================
  # Lambda Deployment
  # ============================================================================
  deploy:
    desc: Build and deploy to AWS Lambda
    cmds:
      - task: release:snapshot
      - serverless deploy --stage {{.STAGE}}
    vars:
      STAGE: '{{.STAGE | default "dev"}}'

  deploy:remove:
    desc: Remove Lambda deployment
    cmds:
      - serverless remove --stage {{.STAGE}}
    vars:
      STAGE: '{{.STAGE | default "dev"}}'

  # ============================================================================
  # Infrastructure (Local Dev Stack)
  # ============================================================================
  infra:up:
    desc: Start local infra stack (OTel Collector + Tempo + Grafana + PostgreSQL)
    dir: deployments/docker
    cmds:
      - docker compose up -d

  infra:down:
    desc: Stop local infra stack
    dir: deployments/docker
    cmds:
      - docker compose down

  infra:logs:
    desc: Tail local infra stack logs
    dir: deployments/docker
    cmds:
      - docker compose logs -f

  # ============================================================================
  # Database Migration (golang-migrate)
  # ============================================================================
  db:migrate:up:
    desc: Apply all pending migrations
    cmds:
      - go run ./cmd/migrate/ -config {{.CONFIG}} up
    vars:
      CONFIG: '{{.CONFIG | default "configs/local.yaml"}}'

  db:migrate:down:
    desc: Roll back all migrations (destructive)
    cmds:
      - go run ./cmd/migrate/ -config {{.CONFIG}} -yes down
    vars:
      CONFIG: '{{.CONFIG | default "configs/local.yaml"}}'

  db:migrate:steps:
    desc: 'Move n migrations up/down (usage: task db:migrate:steps -- -1)'
    cmds:
      - go run ./cmd/migrate/ -config {{.CONFIG}} -yes steps {{.CLI_ARGS}}
    vars:
      CONFIG: '{{.CONFIG | default "configs/local.yaml"}}'

  db:migrate:version:
    desc: Print the current schema version
    cmds:
      - go run ./cmd/migrate/ -config {{.CONFIG}} version
    vars:
      CONFIG: '{{.CONFIG | default "configs/local.yaml"}}'

  db:migrate:force:
    desc: 'Pin version and clear the dirty flag (usage: task db:migrate:force -- 1)'
    cmds:
      - go run ./cmd/migrate/ -config {{.CONFIG}} force {{.CLI_ARGS}}
    vars:
      CONFIG: '{{.CONFIG | default "configs/local.yaml"}}'

  db:migrate:create:
    desc: 'Create a migration pair (usage: task db:migrate:create -- add_user_table)'
    dir: '{{.MIGRATIONS_DIR}}'
    vars:
      MIGRATIONS_DIR: scripts/migrations/identity
    cmds:
      - |
        set -eu
        name="{{.CLI_ARGS}}"
        if [ -z "$name" ]; then
          echo "usage: task db:migrate:create -- <name>" >&2
          exit 1
        fi
        last=$(ls | grep -Eo '^[0-9]{6}' | sort -n | tail -1 || true)
        next=$(printf "%06d" $(( ${last:-0} + 1 )))
        for direction in up down; do
          file="${next}_${name}.${direction}.sql"
          echo "-- TODO: write the ${direction} migration for ${name}" > "$file"
          echo "created {{.MIGRATIONS_DIR}}/${file}"
        done

  build:migrate:
    desc: Build the migration CLI binary
    cmds:
      - go build -o {{.BUILD_DIR}}/migrate ./cmd/migrate/

  # ============================================================================
  # Clean
  # ============================================================================
  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}
      - rm -rf dist

# yaml-language-server: $schema=https://raw.githubusercontent.com/serverless/serverless/main/lib/configSchema.json
# Serverless Framework v4 configuration for go-ddd
# Documentation: https://www.serverless.com/framework/docs

service: go-ddd

provider:
  name: aws
  runtime: provided.al2023
  architecture: arm64
  region: ${opt:region, 'ap-northeast-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 30

functions:
  api:
    handler: bootstrap
    package:
      artifact: dist/service_linux_arm64_v8.0/bootstrap.zip
    layers:
      # Lambda Web Adapter - converts HTTP server to Lambda
      # https://github.com/awslabs/aws-lambda-web-adapter
      - arn:aws:lambda:${aws:region}:753240598075:layer:LambdaAdapterLayerArm64:24
    environment:
      AWS_LWA_PORT: 8080
      SERVER_HTTP_HOST: "0.0.0.0"
      SERVER_HTTP_PORT: "8080"
    events:
      - httpApi: '*'

  # Schema migrations. No events: invoke it manually or from the deploy pipeline
  # (`serverless invoke -f migrate`). The same binary as the migrate CLI — it
  # detects AWS_LAMBDA_RUNTIME_API and applies pending migrations, nothing else.
  migrate:
    handler: bootstrap
    description: Applies pending schema migrations for the Identity bounded context
    # Migrations may run far longer than an HTTP request; 900s is the Lambda ceiling.
    timeout: 900
    package:
      artifact: dist/migrate_linux_arm64_v8.0/bootstrap.zip
    # Database settings come from APP_IDENTITY_DATABASE_* environment variables.
    # Inject them at deploy time (SSM / Secrets Manager) rather than committing
    # credentials here, and give the function VPC access to reach RDS.
    # environment:
    #   APP_IDENTITY_DATABASE_HOST: ${ssm:/go-ddd/db/host}
    #   APP_IDENTITY_DATABASE_NAME: identity
    #   APP_IDENTITY_DATABASE_USER: ${ssm:/go-ddd/db/user}
    #   APP_IDENTITY_DATABASE_PASSWORD: ${ssm:/go-ddd/db/password~true}
    #   APP_IDENTITY_DATABASE_SSL_MODE: require

package:
  # Each function ships its own prebuilt artifact, so they cannot share one zip.
  individually: true

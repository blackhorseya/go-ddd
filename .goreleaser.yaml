# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# GoReleaser configuration for go-ddd project
# Documentation: https://goreleaser.com

version: 2

project_name: go-ddd

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: service
    main: ./cmd/service
    binary: service
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.ShortCommit}}
      - -X main.Date={{.Date}}
    hooks:
      post:
        - cmd: sh -c 'if [ "{{ .Arch }}" = "arm64" ]; then cp {{ .Path }} {{ dir .Path }}/bootstrap && zip -j {{ dir .Path }}/bootstrap.zip {{ dir .Path }}/bootstrap; fi'
          output: true

  # Schema migration binary — shipped alongside the service so a deployment can run
  # migrations (e.g. a Kubernetes initContainer) with a binary of the exact same
  # version. The same binary serves as a Lambda function: it switches to Runtime
  # API mode when AWS_LAMBDA_RUNTIME_API is set, which is why it also gets the
  # bootstrap packaging below.
  - id: migrate
    main: ./cmd/migrate
    binary: migrate
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    hooks:
      post:
        - cmd: sh -c 'if [ "{{ .Arch }}" = "arm64" ]; then cp {{ .Path }} {{ dir .Path }}/bootstrap && zip -j {{ dir .Path }}/bootstrap.zip {{ dir .Path }}/bootstrap; fi'
          output: true

archives:
  # One archive per binary: an environment that only runs migrations does not
  # need to download the service, and vice versa.
  - id: service
    ids:
      - service
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

  - id: migrate
    ids:
      - migrate
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}-migrate_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Release notes 由 release-drafter 產生，goreleaser 不再生成 changelog
changelog:
  disable: true

dockers_v2:
  # One image per binary, all built from the same Dockerfile (BINARY build arg).
  - id: service
    ids:
      - service
    dockerfile: Dockerfile
    build_args:
      BINARY: service
    images:
      - ghcr.io/blackhorseya/go-ddd-api
    # Layer cache via GitHub Actions cache. Only when CD exposes the runtime
    # token; empty flags are dropped, so local builds run without it.
    flags:
      - '{{ if isEnvSet "ACTIONS_RUNTIME_TOKEN" }}--cache-from=type=gha,scope=go-ddd-api{{ end }}'
      - '{{ if isEnvSet "ACTIONS_RUNTIME_TOKEN" }}--cache-to=type=gha,scope=go-ddd-api,mode=max,ignore-error=true{{ end }}'
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}-api"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.source: "https://github.com/blackhorseya/go-ddd"
      org.opencontainers.image.description: "Go DDD template project — service (HTTP/gRPC API)"

  - id: migrate
    ids:
      - migrate
    dockerfile: Dockerfile
    build_args:
      BINARY: migrate
    images:
      - ghcr.io/blackhorseya/go-ddd-migrate
    # Layer cache via GitHub Actions cache. Only when CD exposes the runtime
    # token; empty flags are dropped, so local builds run without it.
    flags:
      - '{{ if isEnvSet "ACTIONS_RUNTIME_TOKEN" }}--cache-from=type=gha,scope=go-ddd-migrate{{ end }}'
      - '{{ if isEnvSet "ACTIONS_RUNTIME_TOKEN" }}--cache-to=type=gha,scope=go-ddd-migrate,mode=max,ignore-error=true{{ end }}'
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}-migrate"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.source: "https://github.com/blackhorseya/go-ddd"
      org.opencontainers.image.description: "Go DDD template project — migrate (one-shot schema applier)"

release:
  github:
    owner: blackhorseya
    name: go-ddd
  draft: false
  prerelease: auto
  # keep-existing：保留 release-drafter 發佈的 release notes，只上傳 artifacts
  mode: keep-existing
  name_template: "v{{ .Version }}"
